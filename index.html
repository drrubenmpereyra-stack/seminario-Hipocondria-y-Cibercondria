<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminario Intensivo: Hipocondría y Cibercondría - Dr. y Mgter. Rubén M. Pereyra</title>
    <style>
        :root {
            --bg-pastel-1: #eef2f7;
            --bg-pastel-2: #e2e8f0;
            --primary-color: #2b4c6f;
            --accent-color: #0d9488;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --card-bg: rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fondo temático: Simbolismo de tecnología/medicina sutil en tonos pastel */
        body {
            background-color: var(--bg-pastel-1);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(13, 148, 136, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(43, 76, 111, 0.08) 0%, transparent 40%),
                linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Selector superior de rol */
        .role-switcher-bar {
            background-color: #1e293b;
            color: #fff;
            padding: 8px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .role-switcher-bar select {
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            background: #334155;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* Encabezado Superior Obligatorio */
        header.seminar-header {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            background-color: #fff;
        }

        .header-titles h1 {
            font-size: 1.35rem;
            color: var(--primary-color);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .header-titles h2 {
            font-size: 1rem;
            color: #475569;
            font-weight: 500;
        }

        .header-titles h3 {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Menú de botones en el borde del encabezado */
        .nav-buttons-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .nav-btn {
            background-color: #ffffff;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* Contenedor principal de contenido dinámico */
        main.content-container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 25px auto;
            padding: 0 20px;
        }

        .view-panel {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .view-panel h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--bg-pastel-2);
            padding-bottom: 8px;
        }

        .view-panel p {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* Estilos de la Pantalla de Login */
        .login-box {
            max-width: 400px;
            margin: 0 auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
        }

        .login-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: var(--accent-color);
        }

        .login-error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }

        footer.seminar-footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Barra de selección de roles -->
    <div class="role-switcher-bar">
        <span>Seleccionar Nivel de Usuario:</span>
        <select id="roleSelector" onchange="cambiarRol(this.value)">
            <option value="admin">A- Nivel Administrador</option>
            <option value="participante">B- Nivel Participante</option>
        </select>
    </div>

    <!-- Encabezado Superior Obligatorio -->
    <header class="seminar-header">
        <div class="header-top">
            <!-- La imagen del logo contenida en el mismo repositorio -->
            <img src="logotipo.jpg" alt="Logotipo Clínica de la Convergencia" class="header-logo" onerror="this.src='https://placehold.co/80x80?text=LOGO'">
            <div class="header-titles">
                <h1>Seminario Intensivo: Hipocondría y Cibercondría: El Terror al Cuerpo Enfermo en la Era de la Información</h1>
                <h2>Dr. y Mgter. Rubén M. Pereyra</h2>
                <h3>Clínica de la Convergencia</h3>
            </div>
        </div>

        <!-- Menú de botones dinámico según rol y autenticación -->
        <nav class="nav-buttons-container" id="navMenu">
            <!-- Los botones se generan dinámicamente desde app.js -->
        </nav>
    </header>

    <!-- Contenido Dinámico de las páginas -->
    <main class="content-container">
        <div id="dynamicView" class="view-panel">
            <!-- El contenido cambia dinámicamente según la opción seleccionada o login -->
        </div>
    </main>

    <!-- Pie de página institucional -->
    <footer class="seminar-footer">
        Clínica de la Convergencia &copy; 2026 - Todos los derechos reservados
    </footer>

    <!-- Script de lógica separado -->
    <script src="app.js"></script>
</body>
</html>
